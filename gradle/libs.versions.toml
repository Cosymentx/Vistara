espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
hilt = "2.60.1"
materialIconsCore = "1.7.8"
playServicesAdsIdentifier = "18.3.0"
room = "2.8.5"
retrofit = "3.0.0"
okhttp = "5.5.0"
coil = "2.7.0"
navigation = "2.10.1"
constraint = "1.1.2"
