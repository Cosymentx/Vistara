name: Build Release AAB

# 合并到 main / master 时自动触发测试 + 生产版 AAB 打包
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 同分支只保留最新一次构建，旧的自动取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ============================================================
  # 阶段 1：单元测试 + 覆盖率门禁
  # ============================================================
  test:
    name: Unit Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Run app unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      # 当前项目未应用 Kover，执行一次完整 Debug 编译作为构建前验证
      - name: Compile debug build
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            app/build/outputs/apk/debug/
          retention-days: 7

  # ============================================================
  # 阶段 2：构建 Release AAB + 创建 Release
  # ============================================================
  build-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    needs: test  # 测试通过后才构建

    steps:
      # —— 1. 拉取代码 ——
      - name: Checkout
        uses: actions/checkout@v7

      # —— 1.1 获取版本号（用于 Release 命名） ——
      - name: Get Version Name
        id: get_version
        run: |
          # 从 build.gradle.kts 提取 versionName (仅匹配赋值语句)
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*"' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      # —— 2. 配置 JDK 21（与 compileOptions 保持一致）+ Gradle 缓存 ——
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # —— 3. 赋予 gradlew 执行权限 ——
      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # —— 4. 从 Secret 还原 release 签名文件 ——
      # 需要提前在仓库 Settings -> Secrets -> Actions 中配置以下 4 个 Secret：
      #   SIGNING_STORE_BASE64    : base64 编码的 app/vistara.jks 文件内容
      #                             生成方式（macOS/Linux）: base64 -w 0 app/vistara.jks
      #                             生成方式（Windows/PowerShell）: [Convert]::ToBase64String([IO.File]::ReadAllBytes("app\vistara.jks"))
      #   SIGNING_STORE_PASSWORD  : keystore 密码
      #   SIGNING_KEY_ALIAS       : key 别名
      #   SIGNING_KEY_PASSWORD    : key 密码
      - name: Decode release keystore
        run: |
          echo "${{ secrets.SIGNING_STORE_BASE64 }}" | base64 --decode > app/vistara.jks

      - name: Verify keystore
        shell: bash
        run: |
          keytool -list -keystore app/vistara.jks \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -alias "${{ secrets.SIGNING_KEY_ALIAS }}"

      # —— 5. 构建 Release AAB ——
      - name: Build Release AAB
        env:
          # app/build.gradle.kts 中的 signingConfig 读取这些环境变量
          SIGNING_STORE_PATH: vistara.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # 编码设置，与本地 build-common.sh 保持一致
          GRADLE_OPTS: -Dfile.encoding=utf-8
        run: |
          ./gradlew :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # —— 6. 从 AAB 提取 Universal APK ——
      # 理由：为了在 GitHub Release 中同时提供 AAB 和可在真机直接安装的 APK。
      # 使用 Google 官方的 bundletool 工具进行转换。
      - name: Extract Universal APK from AAB
        run: |
          # 1. 下载 bundletool
          BUNDLETOOL_VERSION="1.17.2"
          curl -L -o bundletool.jar https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar

          # 2. 自动定位生成的 AAB 文件 (避免硬编码文件名)
          AAB_PATH=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "Found AAB at: $AAB_PATH"

          # 3. 使用 bundletool 生成包含所有架构的 Universal APK (APKS 格式)
          # --mode=universal 会生成一个包含所有资源和代码的单体 APK
          java -jar bundletool.jar build-apks \
            --bundle="$AAB_PATH" \
            --output=app.apks \
            --mode=universal \
            --ks=app/vistara.jks \
            --ks-pass=pass:${{ secrets.SIGNING_STORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.SIGNING_KEY_PASSWORD }}

          # 4. 从 .apks 压缩包中提取 universal.apk 并重命名
          mkdir -p app/build/outputs/apk/
          unzip -p app.apks universal.apk > app/build/outputs/apk/app-release-universal.apk

          # 5. 清理临时生成的工具和中间产物
          rm -f bundletool.jar app.apks
          echo "Universal APK extracted to: app/build/outputs/apk/app-release-universal.apk"

      # —— 7. 创建 GitHub Release 并上传 AAB 和 APK ——
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          # 使用版本号 + 构建号作为 Tag，避免冲突
          tag_name: v${{ steps.get_version.outputs.VERSION_NAME }}-b${{ github.run_number }}
          name: Vistara Release v${{ steps.get_version.outputs.VERSION_NAME }} (Build ${{ github.run_number }})
          body: |
            ### 🚀 Vistara Release
            - **Version:** ${{ steps.get_version.outputs.VERSION_NAME }}
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}

            > 此包由 GitHub Actions 自动构建并发布。
            > ✅ 单元测试已通过
            > ✅ Kover 覆盖率门禁已通过
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/app-release-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
